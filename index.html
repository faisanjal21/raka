<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB DASHBOARD - Sistem Kontrol Pencahayaan Pintar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        theme: {
                            bgStart: '#0d0b18',
                            bgEnd: '#1a1333',
                            cardBg: 'rgba(28, 20, 52, 0.65)',
                            cardBorder: 'rgba(168, 85, 247, 0.2)',
                            violetGlow: '#d946ef',
                            violetBright: '#e879f9',
                            emerald: '#10b981',
                            coral: '#f43f5e',
                            gold: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at 50% 10%, #2e1065 0%, #0d0b18 60%, #05030a 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        
        .glass-card {
            background: rgba(26, 19, 48, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(217, 70, 239, 0.18);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.6), 0 0 20px 0 rgba(192, 38, 211, 0.1);
        }

        .glass-card-inner {
            background: rgba(18, 12, 36, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Dropdown Custom Style */
        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e879f9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1rem;
            padding-right: 2.5rem;
        }

        /* Time Input Styling */
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(1) saturate(5) hue-rotate(240deg);
            cursor: pointer;
        }

        /* Glowing Pulse Animations */
        @keyframes pulse-violet {
            0%, 100% { box-shadow: 0 0 15px rgba(217, 70, 239, 0.5), inset 0 0 10px rgba(217, 70, 239, 0.3); }
            50% { box-shadow: 0 0 30px rgba(232, 121, 249, 0.9), inset 0 0 15px rgba(232, 121, 249, 0.5); }
        }
        .glow-violet {
            animation: pulse-violet 2.5s infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-6 antialiased selection:bg-fuchsia-500 selection:text-white">

    <!-- Container Utama Dashboard -->
    <main class="w-full max-w-md sm:max-w-lg glass-card rounded-3xl p-5 sm:p-7 my-auto relative overflow-hidden transition-all duration-300">
        
        <!-- Header Section -->
        <header class="text-center mb-6">
            <div class="flex justify-between items-center mb-3">
                <span id="api-status-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-slate-900/80 text-gray-400 border border-gray-800">
                    <span class="w-2 h-2 rounded-full bg-gray-500" id="status-dot"></span>
                    <span id="status-text">Memeriksa Koneksi...</span>
                </span>
                
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-fuchsia-400 transition-colors p-2 rounded-full hover:bg-white/5" title="Pengaturan Blynk">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>

            <h1 class="font-heading text-2xl sm:text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 via-pink-400 to-purple-300 uppercase">
                WEB DASHBOARD
            </h1>
            <p class="text-xs sm:text-sm text-purple-200/80 font-medium tracking-wide mt-1">
                Sistem Kontrol Pencahayaan Pintar
            </p>
        </header>

        <!-- Waktu Lokal Card -->
        <section class="glass-card-inner rounded-2xl p-4 mb-6 text-center border border-fuchsia-500/20 shadow-inner">
            <span class="text-xs uppercase tracking-widest text-fuchsia-400 font-bold block mb-1">
                WAKTU LOKAL (WIB)
            </span>
            <div id="digital-clock" class="text-3xl sm:text-4xl font-black text-white tracking-widest font-mono drop-shadow-[0_0_12px_rgba(232,121,249,0.4)]">
                00:00:00
            </div>
        </section>

        <!-- LAMPU 1 (L1) SECTION -->
        <section class="glass-card-inner rounded-2xl p-4 sm:p-5 mb-5 border border-purple-500/20 hover:border-fuchsia-500/40 transition-all">
            <!-- Lampu Control Bar -->
            <div class="flex items-center justify-between pb-4 border-b border-purple-900/40">
                <div class="flex items-center gap-3">
                    <div id="l1-icon-bg" class="w-12 h-12 rounded-2xl flex items-center justify-center bg-slate-900/80 text-gray-500 transition-all duration-300 border border-gray-800">
                        <i id="l1-icon" class="fa-solid fa-lightbulb text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="font-heading font-bold text-lg text-white leading-tight">L1 <span class="text-xs font-normal text-purple-300/70">(Lampu Satu)</span></h2>
                        <span id="l1-status-text" class="text-xs font-semibold text-gray-400">Mati</span>
                    </div>
                </div>

                <!-- L1 Button Switch -->
                <button id="l1-btn" onclick="toggleLight('L1')" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-slate-900 text-gray-400 border border-purple-900/50 hover:border-fuchsia-500/50 transition-all duration-200 active:scale-95 shadow-md">
                    OFF
                </button>
            </div>

            <!-- Timer L1 -->
            <div class="pt-4">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2 text-xs font-semibold text-fuchsia-400">
                        <i class="fa-regular fa-clock"></i>
                        <span>Timer Otomatis L1</span>
                    </div>
                    <!-- L1 Timer Toggle Switch -->
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="l1-timer-enable" class="sr-only peer" onchange="toggleTimerState('L1')">
                        <div class="w-11 h-6 bg-slate-900 border border-purple-900/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-fuchsia-500 peer-checked:border-fuchsia-400"></div>
                    </label>
                </div>

                <!-- Dropdown Selectors L1 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-medium text-purple-200/70 mb-1">Jam Nyala (ON)</label>
                        <input type="time" id="l1-on-time" onchange="saveTimerSettings('L1')" class="w-full bg-slate-950/80 border border-purple-900/50 text-fuchsia-300 font-mono text-xs rounded-xl p-2.5 focus:border-fuchsia-400 focus:outline-none cursor-pointer text-center">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-purple-200/70 mb-1">Jam Mati (OFF)</label>
                        <input type="time" id="l1-off-time" onchange="saveTimerSettings('L1')" class="w-full bg-slate-950/80 border border-purple-900/50 text-fuchsia-300 font-mono text-xs rounded-xl p-2.5 focus:border-fuchsia-400 focus:outline-none cursor-pointer text-center">
                    </div>
                </div>
            </div>
        </section>

        <!-- LAMPU 2 (L2) SECTION -->
        <section class="glass-card-inner rounded-2xl p-4 sm:p-5 mb-6 border border-purple-500/20 hover:border-fuchsia-500/40 transition-all">
            <!-- Lampu Control Bar -->
            <div class="flex items-center justify-between pb-4 border-b border-purple-900/40">
                <div class="flex items-center gap-3">
                    <div id="l2-icon-bg" class="w-12 h-12 rounded-2xl flex items-center justify-center bg-slate-900/80 text-gray-500 transition-all duration-300 border border-gray-800">
                        <i id="l2-icon" class="fa-solid fa-lightbulb text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="font-heading font-bold text-lg text-white leading-tight">L2 <span class="text-xs font-normal text-purple-300/70">(Lampu Dua)</span></h2>
                        <span id="l2-status-text" class="text-xs font-semibold text-gray-400">Mati</span>
                    </div>
                </div>

                <!-- L2 Button Switch -->
                <button id="l2-btn" onclick="toggleLight('L2')" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-slate-900 text-gray-400 border border-purple-900/50 hover:border-fuchsia-500/50 transition-all duration-200 active:scale-95 shadow-md">
                    OFF
                </button>
            </div>

            <!-- Timer L2 -->
            <div class="pt-4">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2 text-xs font-semibold text-fuchsia-400">
                        <i class="fa-regular fa-clock"></i>
                        <span>Timer Otomatis L2</span>
                    </div>
                    <!-- L2 Timer Toggle Switch -->
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="l2-timer-enable" class="sr-only peer" onchange="toggleTimerState('L2')">
                        <div class="w-11 h-6 bg-slate-900 border border-purple-900/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-fuchsia-500 peer-checked:border-fuchsia-400"></div>
                    </label>
                </div>

                <!-- Dropdown Selectors L2 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-medium text-purple-200/70 mb-1">Jam Nyala (ON)</label>
                        <input type="time" id="l2-on-time" onchange="saveTimerSettings('L2')" class="w-full bg-slate-950/80 border border-purple-900/50 text-fuchsia-300 font-mono text-xs rounded-xl p-2.5 focus:border-fuchsia-400 focus:outline-none cursor-pointer text-center">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-purple-200/70 mb-1">Jam Mati (OFF)</label>
                        <input type="time" id="l2-off-time" onchange="saveTimerSettings('L2')" class="w-full bg-slate-950/80 border border-purple-900/50 text-fuchsia-300 font-mono text-xs rounded-xl p-2.5 focus:border-fuchsia-400 focus:outline-none cursor-pointer text-center">
                    </div>
                </div>
            </div>
        </section>

        <!-- GLOBAL MASTER ACTION BUTTONS -->
        <section class="grid grid-cols-2 gap-4">
            <button onclick="setAllLights(1)" class="flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl font-bold text-sm text-emerald-300 bg-emerald-950/40 border border-emerald-500/60 hover:bg-emerald-500/20 active:scale-95 transition-all duration-200 shadow-lg shadow-emerald-950/50">
                <i class="fa-solid fa-power-off"></i>
                <span>Hidupkan Semua</span>
            </button>
            <button onclick="setAllLights(0)" class="flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl font-bold text-sm text-rose-300 bg-rose-950/40 border border-rose-500/60 hover:bg-rose-500/20 active:scale-95 transition-all duration-200 shadow-lg shadow-rose-950/50">
                <i class="fa-solid fa-power-off"></i>
                <span>Matikan Semua</span>
            </button>
        </section>

        <!-- Notification Toast -->
        <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-2xl border border-fuchsia-500/40 text-xs font-semibold shadow-2xl transition-all z-50 flex items-center gap-2.5 backdrop-blur-md">
            <i class="fa-solid fa-circle-info text-fuchsia-400"></i>
            <span id="toast-message">Notifikasi</span>
        </div>
    </main>

    <!-- Modal Pengaturan Config Blynk & Pin -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card bg-slate-950 border border-purple-500/30 w-full max-w-md rounded-2xl p-6 relative">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-purple-900/40">
                <h3 class="font-heading text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-fuchsia-400"></i>
                    Pengaturan Blynk IoT
                </h3>
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-purple-200/80 mb-1">Blynk Auth Token</label>
                    <input type="text" id="cfg-token" class="w-full bg-slate-900 border border-purple-900/60 text-fuchsia-300 p-2.5 rounded-xl font-mono focus:border-fuchsia-400 focus:outline-none" placeholder="Masukkan Auth Token">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-purple-200/80 mb-1">Virtual Pin L1</label>
                        <input type="text" id="cfg-pin-l1" class="w-full bg-slate-900 border border-purple-900/60 text-white p-2.5 rounded-xl font-mono focus:border-fuchsia-400 focus:outline-none" placeholder="V0">
                    </div>
                    <div>
                        <label class="block font-medium text-purple-200/80 mb-1">Virtual Pin L2</label>
                        <input type="text" id="cfg-pin-l2" class="w-full bg-slate-900 border border-purple-900/60 text-white p-2.5 rounded-xl font-mono focus:border-fuchsia-400 focus:outline-none" placeholder="V1">
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-purple-200/80 mb-1">Blynk Server Domain</label>
                    <input type="text" id="cfg-server" class="w-full bg-slate-900 border border-purple-900/60 text-gray-400 p-2.5 rounded-xl font-mono focus:border-fuchsia-400 focus:outline-none" value="blynk.cloud">
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button onclick="saveConfiguration()" class="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-fuchsia-500 to-purple-600 text-white hover:opacity-95 transition-opacity shadow-lg shadow-fuchsia-500/25">
                    Simpan Pengaturan
                </button>
            </div>
        </div>
    </div>

    <!-- Script Logika & API Integration -->
    <script>
        // Configuration
        let config = {
            authToken: localStorage.getItem('blynk_token') || 'kPJp8oY2if1I0CDggnhxuLcaef6vaaCz',
            pinL1: localStorage.getItem('blynk_pin_l1') || 'V0',
            pinL2: localStorage.getItem('blynk_pin_l2') || 'V1',
            server: 'blynk.cloud'
        };

        // State Lampu
        const lights = {
            L1: {
                state: 0,
                pin: config.pinL1,
                timerActive: false,
                onTime: "18:00",
                offTime: "06:00"
            },
            L2: {
                state: 0,
                pin: config.pinL2,
                timerActive: false,
                onTime: "18:00",
                offTime: "06:00"
            }
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedTimers();
            updateClock();
            setInterval(updateClock, 1000);
            
            // Sync status Blynk
            syncBlynkState();
            setInterval(syncBlynkState, 5000);
        });

        // 1. Digital Clock & Timer Logic
        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Jakarta', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const timeString = new Intl.DateTimeFormat('id-ID', options).format(now).replace(/\./g, ':');
            
            document.getElementById('digital-clock').innerText = timeString;

            const currentTimeHM = timeString.substring(0, 5);
            const currentSeconds = now.getSeconds();

            if (currentSeconds === 0) {
                checkAutoTimers(currentTimeHM);
            }
        }

        // Auto Timer Logic
        function checkAutoTimers(currentHM) {
            ['L1', 'L2'].forEach(key => {
                const l = lights[key];
                if (l.timerActive) {
                    if (currentHM === l.onTime && l.state !== 1) {
                        showToast(`Timer Otomatis: Menyala (${key})`);
                        sendBlynkCommand(key, 1);
                    } else if (currentHM === l.offTime && l.state !== 0) {
                        showToast(`Timer Otomatis: Mati (${key})`);
                        sendBlynkCommand(key, 0);
                    }
                }
            });
        }

        // 2. Blynk REST API Control
        async function sendBlynkCommand(lightKey, value) {
            const pin = lightKey === 'L1' ? config.pinL1 : config.pinL2;
            const url = `https://${config.server}/external/api/update?token=${config.authToken}&${pin}=${value}`;

            updateLightUI(lightKey, value);

            try {
                const response = await fetch(url);
                if (response.ok) {
                    lights[lightKey].state = value;
                    updateApiStatus(true);
                } else {
                    updateApiStatus(false);
                    showToast('Gagal menghubungi Blynk API');
                }
            } catch (error) {
                updateApiStatus(false);
                showToast('Koneksi Blynk Terputus');
            }
        }

        function toggleLight(lightKey) {
            const currentState = lights[lightKey].state;
            const newState = currentState === 1 ? 0 : 1;
            sendBlynkCommand(lightKey, newState);
        }

        function setAllLights(value) {
            sendBlynkCommand('L1', value);
            setTimeout(() => sendBlynkCommand('L2', value), 200);
        }

        // Sync State dari Server Blynk
        async function syncBlynkState() {
            try {
                const urlL1 = `https://${config.server}/external/api/get?token=${config.authToken}&${config.pinL1}`;
                const urlL2 = `https://${config.server}/external/api/get?token=${config.authToken}&${config.pinL2}`;

                const [resL1, resL2] = await Promise.all([
                    fetch(urlL1).then(r => r.text()),
                    fetch(urlL2).then(r => r.text())
                ]);

                if (!isNaN(resL1)) {
                    lights.L1.state = parseInt(resL1);
                    updateLightUI('L1', lights.L1.state);
                }
                if (!isNaN(resL2)) {
                    lights.L2.state = parseInt(resL2);
                    updateLightUI('L2', lights.L2.state);
                }

                updateApiStatus(true);
            } catch (err) {
                updateApiStatus(false);
            }
        }

        // Update UI Komponen dengan tema Violet-Magenta Glow
        function updateLightUI(lightKey, state) {
            const isL1 = lightKey === 'L1';
            const btn = document.getElementById(isL1 ? 'l1-btn' : 'l2-btn');
            const statusText = document.getElementById(isL1 ? 'l1-status-text' : 'l2-status-text');
            const iconBg = document.getElementById(isL1 ? 'l1-icon-bg' : 'l2-icon-bg');
            const icon = document.getElementById(isL1 ? 'l1-icon' : 'l2-icon');

            if (state === 1) {
                // Style State ON (Violet Magenta Neon Glow)
                btn.innerText = 'ON';
                btn.className = 'px-5 py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-fuchsia-500 to-pink-500 text-white border border-fuchsia-300 shadow-lg shadow-fuchsia-500/40 transition-all duration-200 active:scale-95';
                
                statusText.innerText = 'Menyala';
                statusText.className = 'text-xs font-semibold text-fuchsia-400 drop-shadow-[0_0_8px_rgba(232,121,249,0.5)]';

                iconBg.className = 'w-12 h-12 rounded-2xl flex items-center justify-center bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-400/50 glow-violet transition-all duration-300';
                icon.className = 'fa-solid fa-lightbulb text-2xl text-fuchsia-200 drop-shadow-[0_0_10px_rgba(232,121,249,0.8)]';
            } else {
                // Style State OFF
                btn.innerText = 'OFF';
                btn.className = 'px-5 py-2.5 rounded-xl font-bold text-sm bg-slate-900 text-gray-400 border border-purple-900/50 hover:border-fuchsia-500/50 transition-all duration-200 active:scale-95 shadow-md';
                
                statusText.innerText = 'Mati';
                statusText.className = 'text-xs font-semibold text-gray-400';

                iconBg.className = 'w-12 h-12 rounded-2xl flex items-center justify-center bg-slate-900/80 text-gray-500 border border-gray-800 transition-all duration-300';
                icon.className = 'fa-solid fa-lightbulb text-2xl';
            }
        }

        // Status API Badge
        function updateApiStatus(isOnline) {
            const badge = document.getElementById('api-status-badge');
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');

            if (isOnline) {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-fuchsia-950/40 text-fuchsia-300 border border-fuchsia-500/30';
                dot.className = 'w-2 h-2 rounded-full bg-fuchsia-400 animate-pulse';
                text.innerText = 'Blynk Online';
            } else {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-950/40 text-rose-400 border border-rose-500/30';
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                text.innerText = 'Terputus';
            }
        }

        // LocalStorage & Timers
        function toggleTimerState(lightKey) {
            const isL1 = lightKey === 'L1';
            const checkbox = document.getElementById(isL1 ? 'l1-timer-enable' : 'l2-timer-enable');
            lights[lightKey].timerActive = checkbox.checked;
            saveTimerSettings(lightKey);
            
            showToast(`Timer ${lightKey} ${checkbox.checked ? 'Diaktifkan' : 'Dinonaktifkan'}`);
        }

        function saveTimerSettings(lightKey) {
            const isL1 = lightKey === 'L1';
            const onVal = document.getElementById(isL1 ? 'l1-on-time' : 'l2-on-time').value;
            const offVal = document.getElementById(isL1 ? 'l1-off-time' : 'l2-off-time').value;
            const enabled = document.getElementById(isL1 ? 'l1-timer-enable' : 'l2-timer-enable').checked;

            lights[lightKey].onTime = onVal;
            lights[lightKey].offTime = offVal;
            lights[lightKey].timerActive = enabled;

            const timerData = {
                enabled: enabled,
                onTime: onVal,
                offTime: offVal
            };

            localStorage.setItem(`timer_${lightKey}`, JSON.stringify(timerData));
        }

        function loadSavedTimers() {
            ['L1', 'L2'].forEach(key => {
                const saved = localStorage.getItem(`timer_${key}`);
                const isL1 = key === 'L1';
                
                if (saved) {
                    const data = JSON.parse(saved);
                    
                    lights[key].timerActive = data.enabled;
                    lights[key].onTime = data.onTime || '18:00';
                    lights[key].offTime = data.offTime || '06:00';

                    document.getElementById(isL1 ? 'l1-timer-enable' : 'l2-timer-enable').checked = data.enabled;
                    document.getElementById(isL1 ? 'l1-on-time' : 'l2-on-time').value = lights[key].onTime;
                    document.getElementById(isL1 ? 'l1-off-time' : 'l2-off-time').value = lights[key].offTime;
                } else {
                    lights[key].onTime = '18:00';
                    lights[key].offTime = '06:00';
                    document.getElementById(isL1 ? 'l1-on-time' : 'l2-on-time').value = '18:00';
                    document.getElementById(isL1 ? 'l1-off-time' : 'l2-off-time').value = '06:00';
                }
            });
        }

        // Modal Settings Handling
        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');

            if (!modal.classList.contains('hidden')) {
                document.getElementById('cfg-token').value = config.authToken;
                document.getElementById('cfg-pin-l1').value = config.pinL1;
                document.getElementById('cfg-pin-l2').value = config.pinL2;
            }
        }

        function saveConfiguration() {
            const newToken = document.getElementById('cfg-token').value.trim();
            const newPinL1 = document.getElementById('cfg-pin-l1').value.trim();
            const newPinL2 = document.getElementById('cfg-pin-l2').value.trim();

            if (!newToken) {
                showToast('Token tidak boleh kosong!');
                return;
            }

            config.authToken = newToken;
            config.pinL1 = newPinL1 || 'V0';
            config.pinL2 = newPinL2 || 'V1';

            localStorage.setItem('blynk_token', config.authToken);
            localStorage.setItem('blynk_pin_l1', config.pinL1);
            localStorage.setItem('blynk_pin_l2', config.pinL2);

            toggleSettingsModal();
            showToast('Pengaturan Blynk disimpan');
            syncBlynkState();
        }

        // Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
